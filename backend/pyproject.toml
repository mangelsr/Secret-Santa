[project]
name = "santa-secreto-backend"
version = "1.0.0"
description = "Backend Serverless en FastAPI + Lambda + DynamoDB + SES para Santa Secreto"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "mangum>=0.17.0",
    "pydantic[email]>=2.4.2",
    "boto3>=1.28.60",
]

[dependency-groups]
dev = [
    "uvicorn>=0.23.0",
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]


