service: santa-secreto-app

frameworkVersion: "4"

provider:
  name: aws
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 30
  ecr:
    images:
      appimage:
        path: ./
        file: Dockerfile
  environment:
    GROUPS_TABLE: ${self:custom.groupsTableName}
    SES_SENDER_EMAIL: ${param:sender-email, opt:sender-email, 'notificaciones@tudominio.com'}
    STAGE: ${self:provider.stage}
    ALLOWED_ORIGINS: !Sub "https://${CloudFrontDistribution.DomainName},http://localhost:5173,http://127.0.0.1:5173"
    SMTP_USER: ${param:smtp-user, env:SMTP_USER, ''}
    SMTP_PASSWORD_PARAM: /santa-secreto/${self:provider.stage}/smtp-password
    SMTP_HOST: ${param:smtp-host, env:SMTP_HOST, 'smtp.gmail.com'}
    SMTP_PORT: ${param:smtp-port, env:SMTP_PORT, '587'}
    SMTP_FROM_NAME: ${param:smtp-from-name, env:SMTP_FROM_NAME, 'Santa Secreto 🎅'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:ConditionCheckItem
          Resource:
            - !GetAtt GroupsTable.Arn
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/santa-secreto/${self:provider.stage}/*"

custom:
  groupsTableName: santa-secreto-groups-${self:provider.stage}
  frontendBucketName: santa-secreto-frontend-${self:provider.stage}

functions:
  api:
    image:
      name: appimage
    events:
      - httpApi:
          path: "/{proxy+}"
          method: "*"
      - httpApi:
          path: "/"
          method: "*"

resources:
  Resources:
    GroupsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.groupsTableName}
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.frontendBucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    CloudFrontOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: !Sub "${AWS::StackName}-s3-oac"
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FrontendBucket
        PolicyDocument:
          Statement:
            - Sid: AllowCloudFrontServicePrincipalReadOnly
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Join ["", ["arn:aws:s3:::", !Ref FrontendBucket, "/*"]]
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: "CDN distribution for Santa Secreto SPA frontend"
          DefaultRootObject: index.html
          Origins:
            - Id: S3BucketOrigin
              DomainName: !GetAtt FrontendBucket.RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""
              OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
          DefaultCacheBehavior:
            TargetOriginId: S3BucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            Compress: true
            MinTTL: 0
            DefaultTTL: 86400
            MaxTTL: 31536000
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
          PriceClass: PriceClass_100
          ViewerCertificate:
            CloudFrontDefaultCertificate: true

  Outputs:
    ApiUrl:
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    S3BucketDomainName:
      Value: !GetAtt FrontendBucket.RegionalDomainName
    CloudFrontUrl:
      Value: !Sub "https://${CloudFrontDistribution.DomainName}"
    CloudFrontDistributionId:
      Value: !Ref CloudFrontDistribution
