service: santa-secreto-app

frameworkVersion: "3"

provider:
  name: aws
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 512
  timeout: 15
  ecr:
    images:
      appimage:
        path: ./
        file: Dockerfile
  environment:
    GROUPS_TABLE: ${self:custom.groupsTableName}
    SES_SENDER_EMAIL: ${param:sender-email, opt:sender-email, 'notificaciones@tudominio.com'}
    STAGE: ${self:provider.stage}
    SMTP_USER: ${param:smtp-user, env:SMTP_USER, ''}
    SMTP_PASSWORD: ${param:smtp-password, env:SMTP_PASSWORD, ''}
    SMTP_HOST: ${param:smtp-host, env:SMTP_HOST, 'smtp.gmail.com'}
    SMTP_PORT: ${param:smtp-port, env:SMTP_PORT, '587'}
    SMTP_FROM_NAME: ${param:smtp-from-name, env:SMTP_FROM_NAME, 'Santa Secreto 🎅'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt GroupsTable.Arn
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"

plugins:
  - serverless-s3-sync

custom:
  groupsTableName: santa-secreto-groups-${self:provider.stage}
  frontendBucketName: santa-secreto-frontend-${self:provider.stage}

  s3Sync:
    - bucketName: ${self:custom.frontendBucketName}
      localDir: ../frontend/dist
      deleteRemoved: true

functions:
  api:
    image:
      name: appimage
    events:
      - httpApi:
          path: "/{proxy+}"
          method: "*"
      - httpApi:
          path: "/"
          method: "*"

resources:
  Resources:
    GroupsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.groupsTableName}
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.frontendBucketName}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FrontendBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource: !Join ["", ["arn:aws:s3:::", !Ref FrontendBucket, "/*"]]

    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: "CDN distribution for Santa Secreto SPA frontend"
          DefaultRootObject: index.html
          Origins:
            - Id: S3WebsiteOrigin
              DomainName: !Select [1, !Split ["//", !GetAtt FrontendBucket.WebsiteURL]]
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: http-only
          DefaultCacheBehavior:
            TargetOriginId: S3WebsiteOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            Compress: true
            MinTTL: 0
            DefaultTTL: 86400
            MaxTTL: 31536000
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
          PriceClass: PriceClass_100
          ViewerCertificate:
            CloudFrontDefaultCertificate: true

  Outputs:
    ApiUrl:
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    S3WebsiteUrl:
      Value: !GetAtt FrontendBucket.WebsiteURL
    CloudFrontUrl:
      Value: !Sub "https://${CloudFrontDistribution.DomainName}"
    CloudFrontDistributionId:
      Value: !Ref CloudFrontDistribution
